openapi: 3.2.0
info:
  title: Junction Unmatched API
  description: https://docs.junction.com/
  version: 0.4.911
servers:
- url: https://api.us.junction.com
  x-fern-server-name: Production
- url: https://api.eu.junction.com
  x-fern-server-name: ProductionEU
- url: https://api.sandbox.us.junction.com
  x-fern-server-name: Sandbox
- url: https://api.sandbox.eu.junction.com
  x-fern-server-name: SandboxEU
security:
- apiKeyAuth: []
tags:
- name: unmatched
paths:
  /v3/unmatched_result_test/case:
    get:
      tags:
      - unmatched
      summary: List Unmatched Result Test Case Catalog
      operationId: list_unmatched_result_test_case_catalog_v3_unmatched_result_test_case_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUnmatchedResultTestCasesResponse'
      x-fern-sdk-group-name: lab_tests
      x-fern-sdk-method-name: list_unmatched_result_test_cases
  /v3/unmatched_result_test:
    post:
      tags:
      - unmatched
      summary: Create Unmatched Result Test
      operationId: create_unmatched_result_test_v3_unmatched_result_test_post
      parameters:
      - name: X-Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
          title: X-Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUnmatchedResultTestBody'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUnmatchedResultTestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: lab_tests
      x-fern-sdk-method-name: create_unmatched_result_test
  /v3/unmatched_result_test/{run_id}:
    get:
      tags:
      - unmatched
      summary: Get Unmatched Result Test
      operationId: get_unmatched_result_test_v3_unmatched_result_test__run_id__get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUnmatchedResultTestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: lab_tests
      x-fern-sdk-method-name: get_unmatched_result_test
  /v3/unmatched_result:
    get:
      tags:
      - unmatched
      summary: List Unmatched Results
      operationId: list_unmatched_results_v3_unmatched_result_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      - name: next_cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The cursor for fetching the next page, or `null` to fetch the first page.
          title: Next Cursor
        description: The cursor for fetching the next page, or `null` to fetch the first page.
      - name: decision_code
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/MatchDecisionCode'
          - type: 'null'
          description: Filter by match decision code.
          title: Decision Code
        description: Filter by match decision code.
      - name: lab_slug
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by lab slug (e.g. `labcorp`, `quest`).
          title: Lab Slug
        description: Filter by lab slug (e.g. `labcorp`, `quest`).
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/MatchReviewStatusFilter'
          - type: 'null'
          description: Filter by review status. `pending_customer_review` returns items awaiting your action; `pending_customer_review:in_progress` returns items your team is working on; `pending_ops_review` returns items you have escalated for review.
          title: Status
        description: Filter by review status. `pending_customer_review` returns items awaiting your action; `pending_customer_review:in_progress` returns items your team is working on; `pending_ops_review` returns items you have escalated for review.
      - name: created_at_start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Filter by result receipt date on or after this date (UTC, inclusive, YYYY-MM-DD).
          title: Created At Start
        description: Filter by result receipt date on or after this date (UTC, inclusive, YYYY-MM-DD).
      - name: created_at_end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Filter by result receipt date on or before this date (UTC, inclusive, YYYY-MM-DD).
          title: Created At End
        description: Filter by result receipt date on or before this date (UTC, inclusive, YYYY-MM-DD).
      - name: search_input
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search by patient first name, last name, or date of birth (e.g. `Alice`, `Smith`, or `1990-01-15`).
          title: Search Input
        description: Search by patient first name, last name, or date of birth (e.g. `Alice`, `Smith`, or `1990-01-15`).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUnmatchedResultResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: lab_tests
      x-fern-sdk-method-name: list_unmatched_results
  /v3/unmatched_result/{raw_result_id}:
    get:
      tags:
      - unmatched
      summary: Get Unmatched Result
      operationId: get_unmatched_result_v3_unmatched_result__raw_result_id__get
      parameters:
      - name: raw_result_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Raw Result Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnmatchedResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: lab_tests
      x-fern-sdk-method-name: get_unmatched_result
  /v3/unmatched_result/{raw_result_id}/accept:
    post:
      tags:
      - unmatched
      summary: Accept Unmatched Result
      operationId: accept_unmatched_result_v3_unmatched_result__raw_result_id__accept_post
      parameters:
      - name: raw_result_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Raw Result Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptUnmatchedResultBody'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientFacingOrder'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: lab_tests
      x-fern-sdk-method-name: accept_unmatched_result
  /v3/unmatched_result/{raw_result_id}/resolve:
    post:
      tags:
      - unmatched
      summary: Resolve Unmatched Result
      operationId: resolve_unmatched_result_v3_unmatched_result__raw_result_id__resolve_post
      parameters:
      - name: raw_result_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Raw Result Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveUnmatchedResultBody'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnmatchedResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: lab_tests
      x-fern-sdk-method-name: resolve_unmatched_result
  /v3/unmatched_result/{raw_result_id}/update:
    post:
      tags:
      - unmatched
      summary: Create Unmatched Result Update
      operationId: create_unmatched_result_update_v3_unmatched_result__raw_result_id__update_post
      parameters:
      - name: raw_result_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Raw Result Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUnmatchedResultUpdateBody'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnmatchedResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: lab_tests
      x-fern-sdk-method-name: create_unmatched_result_update
      x-fern-availability: beta
    get:
      tags:
      - unmatched
      summary: List Unmatched Result Updates
      operationId: list_unmatched_result_updates_v3_unmatched_result__raw_result_id__update_get
      parameters:
      - name: raw_result_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Raw Result Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      - name: next_cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The cursor for fetching the next page, or `null` to fetch the first page.
          title: Next Cursor
        description: The cursor for fetching the next page, or `null` to fetch the first page.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUnmatchedResultUpdatesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: lab_tests
      x-fern-sdk-method-name: list_unmatched_result_updates
      x-fern-availability: beta
components:
  schemas:
    MatchCandidateReasonCode:
      type: string
      enum:
      - sample_id_match
      - lab_account_mismatch
      - matched_completed_order
      - matched_cancelled_order
      - invalid_collection_state
      - demographic_mismatch
      - demographic_match
      - possible_wrong_lab
      - same_lab
      - same_user
      - marker_overlap_exact
      - marker_overlap_partial
      - marker_overlap_none
      title: MatchCandidateReasonCode
      description: ℹ️ This enum is non-exhaustive.
    UnmatchedResultUpdateStatus:
      type: string
      enum:
      - pending_customer_review
      - pending_customer_review:in_progress
      title: UnmatchedResultUpdateStatus
      description: Subset of `MatchReviewTransitionStatus` a customer may move a result to. ℹ️ This enum is non-exhaustive.
    ClientFacingOrderEvent:
      properties:
        id:
          type: integer
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        status:
          $ref: '#/components/schemas/OrderStatus'
          description: ℹ️ This enum is non-exhaustive.
        status_detail:
          anyOf:
          - $ref: '#/components/schemas/OrderStatusDetail'
          - type: 'null'
          description: ℹ️ This enum is non-exhaustive.
      type: object
      required:
      - id
      - created_at
      - status
      title: ClientFacingOrderEvent
    ClientFacingLab:
      properties:
        id:
          type: integer
          title: Id
        slug:
          type: string
          title: Slug
        name:
          type: string
          title: Name
        first_line_address:
          type: string
          title: First Line Address
        city:
          type: string
          title: City
        zipcode:
          type: string
          title: Zipcode
        collection_methods:
          items:
            $ref: '#/components/schemas/LabTestCollectionMethod'
          type: array
          title: Collection Methods
        sample_types:
          items:
            $ref: '#/components/schemas/LabTestSampleType'
          type: array
          title: Sample Types
        logo_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Logo Url
      type: object
      required:
      - id
      - slug
      - name
      - first_line_address
      - city
      - zipcode
      - collection_methods
      - sample_types
      title: ClientFacingLab
      example:
        city: San Francisco
        collection_methods:
        - testkit
        first_line_address: 123 Main St
        id: 1
        logo_url: https://assets.tryvital.io/labs/labcorp.png
        name: LabCorp
        sample_types:
        - saliva
        slug: labcorp
        zipcode: '91789'
    ClientFacingWalkInTestOrder:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: The Vital walk-in test Order ID
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        appointment_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Appointment Id
      type: object
      required:
      - id
      - created_at
      - updated_at
      title: ClientFacingWalkInTestOrder
      description: 'Schema for a walk-in test order in the client facing API.


        To be used as part of a ClientFacingOrder.'
      example:
        appointment_id: b572135e-452f-4f0f-8280-7b2473e1dbe1
        created_at: '2020-01-01T00:00:00Z'
        id: 54d03ddf-f7bc-41a2-99d7-47e0ce314222
        updated_at: '2020-01-01T00:00:00Z'
    ClientFacingTestkitOrder:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: The Vital TestKit Order ID
        shipment:
          anyOf:
          - $ref: '#/components/schemas/ClientFacingShipment'
          - type: 'null'
          description: Shipment object
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - shipment
      - created_at
      - updated_at
      title: ClientFacingTestkitOrder
      description: 'Schema for a testkit order in the client facing API.


        To be used as part of a ClientFacingOrder.'
      example:
        created_at: '2020-01-01T00:00:00Z'
        id: 5d0c0e31-75cf-4448-a055-a08b852c5d74
        shipment:
          created_at: '2020-01-01T00:00:00.000Z'
          id: 69c5a6a8-406a-4141-8a31-83b99e3dd97b
          inbound_courier: usps
          inbound_tracking_number: <inbound_tracking_number>
          inbound_tracking_url: <inbound_tracking_url>
          notes: <notes>
          outbound_courier: usps
          outbound_tracking_number: <outbound_tracking_number>
          outbound_tracking_url: <outbound_tracking_url>
          updated_at: '2020-01-01T00:00:00.000Z'
        updated_at: '2020-01-01T00:00:00Z'
    ListUnmatchedResultUpdatesResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/UnmatchedResultUpdate'
          type: array
          title: Data
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - next_cursor
      title: ListUnmatchedResultUpdatesResponse
    MatchReviewCandidate:
      properties:
        candidate_type:
          $ref: '#/components/schemas/MatchCandidateType'
          description: ℹ️ This enum is non-exhaustive.
        order_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Order Id
        order_transaction_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Order Transaction Id
        last_status:
          anyOf:
          - $ref: '#/components/schemas/OrderLowLevelStatus'
          - type: 'null'
          description: ℹ️ This enum is non-exhaustive.
        confidence_level:
          $ref: '#/components/schemas/MatchCandidateConfidenceLevel'
          description: ℹ️ This enum is non-exhaustive.
        confidence_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Confidence Score
        reasons:
          items:
            $ref: '#/components/schemas/MatchCandidateReasonCode'
          type: array
          title: Reasons
        marker_overlap:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Marker Overlap
        status_context:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Status Context
      type: object
      required:
      - candidate_type
      - confidence_level
      title: MatchReviewCandidate
    CreateUnmatchedResultTestBody:
      properties:
        case:
          $ref: '#/components/schemas/UnmatchedResultTestCase'
          description: ℹ️ This enum is non-exhaustive.
        order_source:
          $ref: '#/components/schemas/UnmatchedResultTestOrderSource'
          description: ℹ️ This enum is non-exhaustive.
        orders:
          anyOf:
          - additionalProperties:
              type: string
              format: uuid
            type: object
          - type: 'null'
          title: Orders
        result_status:
          $ref: '#/components/schemas/ResultStatus'
          default: final
          description: ℹ️ This enum is non-exhaustive.
        interpretation:
          $ref: '#/components/schemas/Interpretation'
          default: normal
          description: ℹ️ This enum is non-exhaustive.
        lab_test_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Lab Test Id
        wrong_lab_test_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Wrong Lab Test Id
      additionalProperties: false
      type: object
      required:
      - case
      - order_source
      title: CreateUnmatchedResultTestBody
    ResolveUnmatchedResultBody:
      properties:
        action:
          $ref: '#/components/schemas/UnmatchedResultResolutionAction'
          description: ℹ️ This enum is non-exhaustive.
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
      type: object
      required:
      - action
      title: ResolveUnmatchedResultBody
    ClientFacingAtHomePhlebotomyOrderDetails:
      properties:
        type:
          type: string
          const: at_home_phlebotomy
          title: Type
        data:
          anyOf:
          - $ref: '#/components/schemas/ClientFacingAtHomePhlebotomyOrder'
          - type: 'null'
      type: object
      required:
      - type
      title: ClientFacingAtHomePhlebotomyOrderDetails
    UnmatchedResultUpdate:
      properties:
        from_status:
          anyOf:
          - $ref: '#/components/schemas/MatchReviewTransitionStatus'
          - type: 'null'
          description: ℹ️ This enum is non-exhaustive.
        to_status:
          $ref: '#/components/schemas/MatchReviewTransitionStatus'
          description: ℹ️ This enum is non-exhaustive.
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
        actor_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor Id
        actor_type:
          type: string
          enum:
          - customer
          - api
          title: Actor Type
          description: ℹ️ This enum is non-exhaustive.
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - to_status
      - actor_type
      - created_at
      title: UnmatchedResultUpdate
    MatchReviewStatus:
      type: string
      enum:
      - matched
      - pending_customer_review
      - pending_ops_review
      - pending_customer_review:in_progress
      - resolved
      title: MatchReviewStatus
      description: ℹ️ This enum is non-exhaustive.
    ClientFacingOrder:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
          description: User id returned by vital create user request. This id should be stored in your database against the user and used for all interactions with the vital api.
        id:
          type: string
          format: uuid
          title: Id
          description: The Vital Order ID
        team_id:
          type: string
          format: uuid
          title: Team Id
          description: Your team id.
        lab_account_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Lab Account Id
        patient_details:
          anyOf:
          - $ref: '#/components/schemas/ClientFacingPatientDetailsCompatible'
          - type: 'null'
          description: Patient Details
        patient_address:
          anyOf:
          - $ref: '#/components/schemas/PatientAddressCompatible'
          - type: 'null'
          description: Patient Address
        lab_test:
          $ref: '#/components/schemas/ClientFacingLabTest'
          description: The Vital Test associated with the order
        details:
          anyOf:
          - $ref: '#/components/schemas/ClientFacingWalkInOrderDetails'
          - $ref: '#/components/schemas/ClientFacingTestKitOrderDetails'
          - $ref: '#/components/schemas/ClientFacingAtHomePhlebotomyOrderDetails'
          - $ref: '#/components/schemas/ClientFacingOnSiteCollectionOrderDetails'
          title: Details
        sample_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Sample Id
          description: Sample ID
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
          description: Notes associated with the order
        clinical_notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Clinical Notes
        created_at:
          type: string
          format: date-time
          title: Created At
          description: When your order was created
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: When your order was last updated.
        events:
          items:
            $ref: '#/components/schemas/ClientFacingOrderEvent'
          type: array
          title: Events
        status:
          anyOf:
          - $ref: '#/components/schemas/OrderTopLevelStatus'
          - type: 'null'
          description: The top-level status of the latest event for this order. This field is deprecated. Please use `last_event` instead. ℹ️ This enum is non-exhaustive.
          deprecated: true
        last_event:
          $ref: '#/components/schemas/ClientFacingOrderEvent'
          description: The latest event in the order's lifecycle.
        physician:
          anyOf:
          - $ref: '#/components/schemas/ClientFacingPhysician'
          - type: 'null'
        health_insurance_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Health Insurance Id
          description: Vital ID of the health insurance.
        requisition_form_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Requisition Form Url
          description: DEPRECATED. Requistion form url.
        priority:
          type: boolean
          title: Priority
          description: Defines whether order is priority or not. For some labs, this refers to a STAT order.
          default: false
        shipping_details:
          anyOf:
          - $ref: '#/components/schemas/ShippingAddress'
          - type: 'null'
          description: Shipping Details. For unregistered testkit orders.
        activate_by:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Activate By
          description: Schedule an Order to be processed in a future date.
        passthrough:
          anyOf:
          - type: string
          - type: 'null'
          title: Passthrough
        billing_type:
