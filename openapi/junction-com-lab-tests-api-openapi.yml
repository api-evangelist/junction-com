        schema:
          type: integer
          default: 50
          title: Lab Test Limit
      - name: next_cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The cursor for fetching the next page, or `null` to fetch the first page.
          title: Next Cursor
      - name: include_pricing
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Pricing
      - name: lab_account_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: The lab account ID. This lab account is used to determine the availability of markers and lab tests.
          title: Lab Account Id
        description: The lab account ID. This lab account is used to determine the availability of markers and lab tests.
      - name: generation_method
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/LabTestGenerationMethodFilter'
          description: Filter on whether auto-generated lab tests created by Vital, manually created lab tests, or all lab tests should be returned.
          default: manual
        description: Filter on whether auto-generated lab tests created by Vital, manually created lab tests, or all lab tests should be returned.
      - name: lab_slug
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by the slug of the lab for these lab tests.
          title: Lab Slug
        description: Filter by the slug of the lab for these lab tests.
      - name: collection_method
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/LabTestCollectionMethod'
          - type: 'null'
          description: Filter by the collection method for these lab tests.
          title: Collection Method
        description: Filter by the collection method for these lab tests.
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/LabTestStatus'
          - type: 'null'
          description: Filter by the status of these lab tests.
          title: Status
        description: Filter by the status of these lab tests.
      - name: marker_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: integer
          - type: 'null'
          description: Filter to only include lab tests containing these marker IDs.
          title: Marker Ids
        description: Filter to only include lab tests containing these marker IDs.
      - name: provider_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter to only include lab tests containing these provider IDs.
          title: Provider Ids
        description: Filter to only include lab tests containing these provider IDs.
      - name: name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by the name of the lab test (a case-insensitive substring search).
          title: Name
        description: Filter by the name of the lab test (a case-insensitive substring search).
      - name: order_key
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - price
            - created_at
            - updated_at
            type: string
          - type: 'null'
          title: Order Key
      - name: order_direction
        in: query
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
          default: asc
          title: Order Direction
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabTestResourcesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: lab_tests
      x-fern-sdk-method-name: get_paginated
    servers:
    - url: https://api.us.junction.com
      x-fern-server-name: Production
    - url: https://api.eu.junction.com
      x-fern-server-name: ProductionEU
    - url: https://api.sandbox.us.junction.com
      x-fern-server-name: Sandbox
    - url: https://api.sandbox.eu.junction.com
      x-fern-server-name: SandboxEU
  /v3/lab_test/{lab_test_id}/collection_instructions:
    get:
      tags:
      - lab_tests
      summary: Get Lab Test Collection Instructions
      description: 'Get the tube count for an at-home phlebotomy lab test.


        Requires enable_approxdraw_labcorp for Labcorp and enable_approxdraw for

        other labs. Labcorp reuses a saved count or refreshes it with an eligible

        account. Other labs may also generate and store a collection-instructions PDF.'
      operationId: get_lab_test_collection_instructions_v3_lab_test__lab_test_id__collection_instructions_get
      parameters:
      - name: lab_test_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: The identifier Vital assigned to a lab test.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLabTestCollectionInstructionsResponse'
        '422':
          description: Validation Error
          content:
