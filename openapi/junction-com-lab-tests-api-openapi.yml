openapi: 3.2.0
info:
  title: Junction Lab Tests API
  version: '1.0'
  description: 'Operations tagged lab_tests across 2 of this provider''s published API definitions: junction-openapi-live-2026-10-12.json, vital-openapi-original.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.us.junction.com
  x-fern-server-name: Production
- url: https://api.eu.junction.com
  x-fern-server-name: ProductionEU
- url: https://api.sandbox.us.junction.com
  x-fern-server-name: Sandbox
- url: https://api.sandbox.eu.junction.com
  x-fern-server-name: SandboxEU
security:
- apiKeyAuth: []
tags:
- name: lab_tests
paths:
  /v3/lab_tests:
    get:
      tags:
      - lab_tests
      summary: Get Lab Tests For Team
      description: GET all the lab tests the team has access to.
      operationId: get_lab_tests_for_team_v3_lab_tests_get
      deprecated: true
      parameters:
      - name: generation_method
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/LabTestGenerationMethodFilter'
          description: Filter on whether auto-generated lab tests created by Vital, manually created lab tests, or all lab tests should be returned.
          default: manual
        description: Filter on whether auto-generated lab tests created by Vital, manually created lab tests, or all lab tests should be returned.
      - name: lab_slug
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by the slug of the lab for these lab tests.
          title: Lab Slug
        description: Filter by the slug of the lab for these lab tests.
      - name: collection_method
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/LabTestCollectionMethod'
          - type: 'null'
          description: Filter by the collection method for these lab tests.
          title: Collection Method
        description: Filter by the collection method for these lab tests.
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/LabTestStatus'
          - type: 'null'
          description: Filter by the status of these lab tests.
          title: Status
        description: Filter by the status of these lab tests.
      - name: marker_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: integer
          - type: 'null'
          description: Filter to only include lab tests containing these marker IDs.
          title: Marker Ids
        description: Filter to only include lab tests containing these marker IDs.
      - name: provider_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter to only include lab tests containing these provider IDs.
          title: Provider Ids
        description: Filter to only include lab tests containing these provider IDs.
      - name: name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by the name of the lab test (a case-insensitive substring search).
          title: Name
        description: Filter by the name of the lab test (a case-insensitive substring search).
      - name: order_key
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - price
            - created_at
            - updated_at
            type: string
          - type: 'null'
          title: Order Key
      - name: order_direction
        in: query
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
          default: asc
          title: Order Direction
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientFacingLabTest'
                title: Response Get Lab Tests For Team V3 Lab Tests Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: lab_tests
      x-fern-sdk-method-name: get
      x-fern-availability: deprecated
    post:
      tags:
      - lab_tests
      summary: Create Lab Test For Team
      operationId: create_lab_test_for_team_v3_lab_tests_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLabTestRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientFacingLabTest'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: lab_tests
      x-fern-sdk-method-name: create
    servers:
    - url: https://api.us.junction.com
      x-fern-server-name: Production
    - url: https://api.eu.junction.com
      x-fern-server-name: ProductionEU
    - url: https://api.sandbox.us.junction.com
      x-fern-server-name: Sandbox
    - url: https://api.sandbox.eu.junction.com
      x-fern-server-name: SandboxEU
  /v3/lab_tests/{lab_test_id}:
    patch:
      tags:
      - lab_tests
      summary: Update Lab Test For Team
      operationId: update_lab_test_for_team_v3_lab_tests__lab_test_id__patch
      parameters:
      - name: lab_test_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Lab Test Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLabTestRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientFacingLabTest'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: lab_tests
      x-fern-sdk-method-name: update_lab_test
    get:
      tags:
      - lab_tests
      summary: Get Lab Test For Team
      description: GET all the lab tests the team has access to.
      operationId: get_lab_test_for_team_v3_lab_tests__lab_test_id__get
      parameters:
      - name: lab_test_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: The identifier Vital assigned to a lab test.
      - name: lab_account_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: The lab account ID. This lab account is used to determine the availability of markers and lab tests.
          title: Lab Account Id
        description: The lab account ID. This lab account is used to determine the availability of markers and lab tests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientFacingLabTest'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: lab_tests
      x-fern-sdk-method-name: get_by_id
    servers:
    - url: https://api.us.junction.com
      x-fern-server-name: Production
    - url: https://api.eu.junction.com
      x-fern-server-name: ProductionEU
    - url: https://api.sandbox.us.junction.com
      x-fern-server-name: Sandbox
    - url: https://api.sandbox.eu.junction.com
      x-fern-server-name: SandboxEU
  /v3/lab_tests/markers:
    get:
      tags:
      - lab_tests
      summary: Get Markers
      description: List active and orderable markers for a given Lab. Note that reflex markers are not included.
      operationId: get_markers_v3_lab_tests_markers_get
      parameters:
      - name: lab_id
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: integer
          - type: 'null'
          description: The identifier Vital assigned to a lab partner.
          title: Lab Id
        description: The identifier Vital assigned to a lab partner.
      - name: lab_slug
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The slug of the lab for these markers. If both lab_id and lab_slug are provided, lab_slug will be used.
          title: Lab Slug
        description: The slug of the lab for these markers. If both lab_id and lab_slug are provided, lab_slug will be used.
      - name: name
        in: query
        required: false
        schema:
          type: string
          description: The name or test code of an individual biomarker or a panel.
          default: ''
          title: Name
        description: The name or test code of an individual biomarker or a panel.
      - name: a_la_carte_enabled
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: A La Carte Enabled
      - name: include_pricing
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Pricing
      - name: lab_account_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: The lab account ID. This lab account is used to determine the availability of markers and lab tests.
          title: Lab Account Id
        description: The lab account ID. This lab account is used to determine the availability of markers and lab tests.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMarkersResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: lab_tests
      x-fern-sdk-method-name: get_markers
    servers:
    - url: https://api.us.junction.com
      x-fern-server-name: Production
    - url: https://api.eu.junction.com
      x-fern-server-name: ProductionEU
    - url: https://api.sandbox.us.junction.com
      x-fern-server-name: Sandbox
    - url: https://api.sandbox.eu.junction.com
      x-fern-server-name: SandboxEU
  /v3/lab_tests/list_order_set_markers:
    post:
      tags:
      - lab_tests
      summary: Get Markers For Order Set
      operationId: get_markers_for_order_set_v3_lab_tests_list_order_set_markers_post
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Size
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderSetRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMarkersResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: lab_tests
      x-fern-sdk-method-name: get_markers_for_order_set
    servers:
    - url: https://api.us.junction.com
      x-fern-server-name: Production
    - url: https://api.eu.junction.com
      x-fern-server-name: ProductionEU
    - url: https://api.sandbox.us.junction.com
      x-fern-server-name: Sandbox
    - url: https://api.sandbox.eu.junction.com
      x-fern-server-name: SandboxEU
  /v3/lab_tests/{lab_test_id}/markers:
    get:
      tags:
      - lab_tests
      summary: Get Markers For Test
      description: List all markers for a given Lab Test, as well as any associated reflex markers.
      operationId: get_markers_for_test_v3_lab_tests__lab_test_id__markers_get
      parameters:
      - name: lab_test_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: The identifier Vital assigned to a lab test.
      - name: lab_account_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: The lab account ID. This lab account is used to determine the availability of markers and lab tests.
          title: Lab Account Id
        description: The lab account ID. This lab account is used to determine the availability of markers and lab tests.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMarkersResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: lab_tests
      x-fern-sdk-method-name: get_markers_for_lab_test
    servers:
    - url: https://api.us.junction.com
      x-fern-server-name: Production
    - url: https://api.eu.junction.com
      x-fern-server-name: ProductionEU
    - url: https://api.sandbox.us.junction.com
      x-fern-server-name: Sandbox
    - url: https://api.sandbox.eu.junction.com
      x-fern-server-name: SandboxEU
  /v3/lab_tests/{lab_id}/markers/{provider_id}:
    get:
      tags:
      - lab_tests
      summary: Get Markers By Provider Id
      description: GET a specific marker for the given lab and provider_id
      operationId: get_markers_by_provider_id_v3_lab_tests__lab_id__markers__provider_id__get
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          title: The provider id assigned by a Lab.
      - name: lab_id
        in: path
        required: true
        schema:
          type: integer
          title: The identifier Vital assigned to a lab partner.
      - name: lab_account_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: The lab account ID. This lab account is used to determine the availability of markers and lab tests.
          title: Lab Account Id
        description: The lab account ID. This lab account is used to determine the availability of markers and lab tests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientFacingMarker'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: lab_tests
      x-fern-sdk-method-name: get_markers_by_lab_and_provider_id
    servers:
    - url: https://api.us.junction.com
      x-fern-server-name: Production
    - url: https://api.eu.junction.com
      x-fern-server-name: ProductionEU
    - url: https://api.sandbox.us.junction.com
      x-fern-server-name: Sandbox
    - url: https://api.sandbox.eu.junction.com
      x-fern-server-name: SandboxEU
  /v3/lab_tests/labs:
    get:
      tags:
      - lab_tests
      summary: Get Labs
      description: GET all the labs.
      operationId: get_labs_v3_lab_tests_labs_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ClientFacingLab'
                type: array
                title: Response Get Labs V3 Lab Tests Labs Get
      x-fern-sdk-group-name: lab_tests
      x-fern-sdk-method-name: get_labs
    servers:
    - url: https://api.us.junction.com
      x-fern-server-name: Production
    - url: https://api.eu.junction.com
      x-fern-server-name: ProductionEU
    - url: https://api.sandbox.us.junction.com
      x-fern-server-name: Sandbox
    - url: https://api.sandbox.eu.junction.com
      x-fern-server-name: SandboxEU
  /v3/lab_test_promotion:
    get:
      tags:
      - lab_tests
      summary: Get Lab Test Promotions
      operationId: get_lab_test_promotions_v3_lab_test_promotion_get
      parameters:
      - name: source_sandbox_lab_test_ids
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 35
          title: Source Sandbox Lab Test Ids
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LabTestPromotion'
                title: Response Get Lab Test Promotions V3 Lab Test Promotion Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: lab_tests
      x-fern-sdk-method-name: list_promotions
    servers:
    - url: https://api.us.junction.com
      x-fern-server-name: Production
    - url: https://api.eu.junction.com
      x-fern-server-name: ProductionEU
    - url: https://api.sandbox.us.junction.com
      x-fern-server-name: Sandbox
    - url: https://api.sandbox.eu.junction.com
      x-fern-server-name: SandboxEU
  /v3/lab_test/estimate_order_set_pricing:
    post:
      tags:
      - lab_tests
      summary: Estimate Order Set Pricing
      operationId: estimate_order_set_pricing_v3_lab_test_estimate_order_set_pricing_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateOrderSetPricingBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateOrderSetPricingResponse'
        '422':
          description: Validation Error
          content:
            application/json:
