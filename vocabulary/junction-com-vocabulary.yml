method: generated
source: https://docs.junction.com/
vocabulary:
  name: Vital (Junction) Platform Vocabulary
  description: Normative vocabulary and taxonomy for the Junction (formerly Vital / tryVital) health-data API platform. Maps
    the platform's first-class concepts onto canonical schema.org, LOINC, and FHIR-aligned terms so that downstream consumers
    (Naftiko, AI agents, JSON-LD readers) can reason consistently across providers.
  version: 0.1.0
  terms:
  - term: User
    definition: An end user / data subject on the Junction platform.
    tags:
    - Identity
  - term: Team
    definition: A tenant of the Junction platform. Owns users, lab accounts, webhook subscriptions, and ETL pipelines.
    tags:
    - Identity
  - term: Organization
    definition: Parent tenancy containing one or more teams. Governed by the Management API.
    tags:
    - Identity
  - term: Provider
    definition: A wearable, device, lab, or health-data source supported by Junction. 300+ providers.
    tags:
    - Connectivity
  - term: Connection
    definition: A live binding between a User and a Provider, granting Junction permission to pull data.
    tags:
    - Connectivity
  - term: Link Token
    definition: One-time token consumed by the Vital Link Widget to drive a Connection flow.
    tags:
    - Connectivity
  - term: Summary
    definition: Aggregated daily metric — sleep, activity, body, workouts, menstrual cycle, ECG, meals, profile.
    tags:
    - WearableData
  - term: Timeseries
    definition: Per-sample metric — heart rate, HRV, glucose, blood pressure, SpO2, temperature, steps, distance, calories
      (active/basal), sleep stream, workout stream.
    tags:
    - WearableData
  - term: Resource
    definition: A category of normalized data exposed by Junction (sleep, activity, glucose, ...). Resource availability per
      user is queryable via Introspect.
    tags:
    - WearableData
  - term: LabTest
    definition: A SKU in the Junction lab-test compendium.
    tags:
    - LabTesting
  - term: Order
    definition: A request to fulfill a lab test for a User using one of the supported collection methods.
    tags:
    - LabTesting
  - term: OrderTransaction
    definition: A discrete fulfillment artifact under an Order — typically the sample-to-results pipeline run.
    tags:
    - LabTesting
  - term: Biomarker / Marker
    definition: A measured analyte (HbA1c, HDL, vitamin D, ...). Typed by LOINC where possible.
    tags:
    - LabTesting
  - term: Compendium
    definition: The catalog of available biomarkers, markers, panels, and lab-test SKUs Junction supports.
    tags:
    - LabTesting
  - term: Payor / Insurance
    definition: Insurance carrier referenced when ordering insurance-billed lab tests.
    tags:
    - LabTesting
  - term: Physician
    definition: Ordering provider (NPI-identified) responsible for a lab order.
    tags:
    - LabTesting
  - term: PSC
    definition: Patient Service Center — a walk-in collection site.
    tags:
    - LabTesting
  - term: ContinuousQuery
    definition: A named, persisted aggregation defined once and recomputed as new user data lands.
    tags:
    - Sense
  - term: ResultTable
    definition: Materialized output of a continuous query, indexed by user and time.
    tags:
    - Sense
  - term: Webhook
    definition: HTTP subscription delivered by Svix; signed with a per-endpoint secret.
    tags:
    - Operations
  - term: ETL Pipeline
    definition: BYO destination forwarding ingested data to Azure Event Hubs, Google Cloud Pub/Sub, or RabbitMQ.
    tags:
    - Operations
  - term: Region
    definition: Data residency for production and sandbox deployments.
    tags:
    - Operations
